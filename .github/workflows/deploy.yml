# A cada push na main: roda os testes e, se passarem, publica a imagem no ACR
# com a tag "latest". O webhook do ACR avisa o App Service, que baixa a imagem
# nova e reinicia (o modelo treinado em memoria e perdido a cada deploy).
name: Testes e deploy na Azure

on:
  push:
    branches: [main]
    # Mudancas so de documentacao nao reiniciam a producao (o que apagaria o modelo).
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-azure
  cancel-in-progress: false

env:
  IMAGE_REPO: regressao-linear
  APP_URL: https://regressao-linear-d9527f.azurewebsites.net

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPO }}:latest

      - name: Aguardar a versao nova no ar
        run: |
          for i in $(seq 1 60); do
            v=$(curl -fsS "$APP_URL/health" | python3 -c "import sys,json; print(json.load(sys.stdin).get('version',''))" 2>/dev/null || true)
            if [ "$v" = "$GITHUB_SHA" ]; then
              echo "Versao $v no ar: $APP_URL"
              exit 0
            fi
            echo "Ainda em '${v:-indisponivel}', aguardando..."
            sleep 10
          done
          echo "A versao nova nao subiu em 10 minutos. Veja os logs do App Service." >&2
          exit 1
